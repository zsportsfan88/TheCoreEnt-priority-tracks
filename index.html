<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Core - Command Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <style>
        :root { --gold: #C5A059; --bg: #000; --border: #333; --red: #ff4444; --green: #1DB954; --panel: #111; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        aside { width: 210px; background: #0a0a0a; border-right: 1px solid var(--border); padding: 20px 10px; flex-shrink: 0; display: flex; flex-direction: column; z-index: 600; }
        .nav { flex: 1; overflow-y: auto; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; cursor: pointer; color: #666; font-size: 0.75rem; border-radius: 4px; transition: 0.2s; margin-bottom: 2px; }
        li:hover { color: #fff; background: #1a1a1a; }
        li.active { color: #fff; border: 1px solid var(--gold); background: #111; font-weight: bold; }

        main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .header-bar { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #000; z-index: 550; gap: 20px; }
        .search-container { flex: 1; max-width: 400px; }
        #search-input { width: 100%; background: #111; border: 1px solid var(--border); color: #fff; padding: 10px 15px; border-radius: 6px; font-size: 0.85rem; outline: none; }

        .table-wrapper { flex: 1; overflow: auto; background: #000; }
        table { border-collapse: separate; border-spacing: 0; width: 100%; }
        
        /* THE CRITICAL STICKY FIXES */
        thead th { 
            position: sticky; top: 0; z-index: 400; 
            background-color: var(--panel) !important; color: var(--gold) !important; 
            padding: 12px 10px; font-size: 0.58rem; text-transform: uppercase; 
            border-bottom: 2px solid var(--gold); text-align: center; height: 85px;
            min-width: 120px;
        }
        
        thead th.sticky-song { z-index: 500 !important; left: 0; background-color: var(--panel) !important; }

        td.sticky-song { 
            position: sticky; left: 0; z-index: 300; 
            min-width: 240px !important; background-color: #0a0a0a !important; 
            border-right: 2px solid var(--border); font-weight: bold; 
            text-align: left; padding-left: 15px !important; font-size: 0.8rem;
        }

        td { padding: 12px 15px; background: #0f0f0f; border-bottom: 1px solid var(--border); font-size: 0.82rem; color: #fff; text-align: center; white-space: nowrap; }
        .heat-cell { color: #000 !important; font-weight: 900; }
        .toggle-btn { background: #111; border: 1px solid var(--border); color: #888; padding: 10px 20px; cursor: pointer; font-size: 0.75rem; font-weight: bold; border-radius: 4px; }
        .toggle-btn.active { background: var(--gold); color: #000; }
    </style>
</head>
<body>

<aside>
    <div style="color:var(--gold); font-weight:900; letter-spacing:2px; margin-bottom:20px; text-align:center; font-size:0.9rem;">THE CORE</div>
    <div class="nav"><ul id="artist-list"></ul></div>
    <div onclick="clearFilter()" style="padding:10px; color:var(--gold); text-align:center; border: 1px solid #333; margin-top:10px; cursor:pointer; font-size: 0.75rem;">SHOW ALL</div>
</aside>

<main>
    <div class="header-bar">
        <h2 id="view-title" style="margin:0; font-size:1.1rem; min-width: 150px;">Priority Tracks</h2>
        <div class="search-container"><input type="text" id="search-input" placeholder="Search song or artist..." onkeyup="render()"></div>
        <div style="display:flex; gap:10px;">
            <button id="btn-released" class="toggle-btn active" onclick="setMode('released')">RELEASED</button>
            <button id="btn-unreleased" class="toggle-btn" onclick="setMode('unreleased')">UNRELEASED</button>
        </div>
    </div>
    <div class="table-wrapper" id="table-output"></div>
</main>

<script>
const MASTER_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTp-yQVU_VNNOR5aXQ7m-Xv7BiAgYKjBfJuT6lIETy6ksjqR-Lj2WW4DNqYGCNX2rfCpUtemiS1shes/pub?gid=2070907343&single=true&output=csv';
const EXCLUDE_LIST = ["Ryan Hurd", "Clever"]; 
const ARTISTS = ["Anna Graves", "Bailey Zimmerman", "Baylee Lynn", "Brandon Wisham", "Cameron Whitcomb", "Dan + Shay", "Danielle Bradbery", "Dax", "Deltona", "Hannah McFarland", "Josh Ross", "Just Jayne", "Nate Smith"];

let allData = [];
let headers = [];
let currentFilter = null;
let currentMode = 'released';

// Helper to find column index by name
const findCol = (names) => {
    return headers.findIndex(h => names.some(n => h.trim().toLowerCase() === n.toLowerCase()));
};

const n = (v) => { if(!v) return 0; return parseFloat(String(v).replace(/[%,$]/g,'')) || 0; };

function getTeaseHeat(teaseStr, relStr) {
    if (!teaseStr || !relStr || teaseStr === "-" || relStr === "-") return '';
    const tease = new Date(teaseStr);
    const rel = new Date(relStr);
    if (isNaN(tease) || isNaN(rel)) return '';
    const diffDays = Math.floor((rel - tease) / (1000 * 60 * 60 * 24));
    if (diffDays >= 20) return 'background: var(--green); color: #000 !important; font-weight: 900;';
    if (diffDays < 14) return 'background: var(--red); color: #000 !important; font-weight: 900;';
    return 'background: #fff; color: #000 !important; font-weight: 900;';
}

function getHeat(val, min, max) {
    let num = n(val);
    if (num === 0) return 'background: #222; color: #666 !important;';
    const ratio = Math.min(Math.max((num - min) / (max - min || 1), 0), 1);
    let r, g, b;
    if (ratio < 0.5) { let f = ratio * 2; r = 255; g = Math.floor(255 * f); b = Math.floor(255 * f); }
    else { let f = (ratio - 0.5) * 2; r = Math.floor(255 * (1 - f)); g = 255; b = Math.floor(255 * (1 - f)); }
    return `background: rgb(${r},${g},${b}); color: #000 !important; font-weight: 900;`;
}

function getPostHeat(val, redLim, greenLim) {
    let num = n(val);
    if (num < redLim) return 'background: var(--red); color: #000 !important; font-weight: 900;';
    if (num >= greenLim) return 'background: var(--green); color: #000 !important; font-weight: 900;';
    return 'background: #fff; color: #000 !important; font-weight: 900;';
}

function getEngageHeat(val) {
    let num = n(val);
    if (num < 5) return 'background: var(--red); color: #000 !important; font-weight: 900;';
    if (num >= 10) return 'background: var(--green); color: #000 !important; font-weight: 900;';
    return getHeat(num, 5, 10);
}

function render() {
    const query = document.getElementById('search-input').value.toLowerCase();
    
    // Dynamic Mapping - Finds the correct index based on header name
    const idx = {
        song: findCol(['SONG']),
        artist: findCol(['ARTIST']),
        tease: findCol(['1st Song Tease', '1st Post']),
        relDate: findCol(['RELEASE DATE']),
        updated: findCol(['Last Updated']),
        status: findCol(['Status']),
        pre: findCol(['Pre-Release Posts/ Platform', 'Pre-Release Artist Posts per platform']),
        wk1: findCol(['1st Wk Streams', '1st Week streams']),
        post: findCol(['Post-Release Posts/ Platform', 'Post-Release Artist Posts per platform']),
        curr: findCol(['Current Streams']),
        avgS: findCol(['Avg Weekly Streams']),
        totalP: findCol(['Total Posts/ Platform', 'TOTAL artist posts per platform']),
        views: findCol(['Avg Views/ Post', 'artist average views']),
        er: findCol(['Engagement Rate', 'Artists Engagement Rate', 'ENG %']),
        ugc: findCol(['Total UGC'])
    };

    const getLocalMax = (colIdx) => {
        if (colIdx === -1) return 1;
        let pool = allData.filter(r => {
            const artist = r[idx.artist] || "";
            if (EXCLUDE_LIST.includes(artist)) return false;
            return currentFilter ? artist === currentFilter : true;
        });
        return Math.max(...pool.map(r => n(r[colIdx])), 1);
    };

    const maxWk1 = getLocalMax(idx.wk1);
    const maxAvgS = getLocalMax(idx.avgS);
    const maxViews = getLocalMax(idx.views);
    const artistMaxUGC = getLocalMax(idx.ugc);

    let songs = allData.filter(r => {
        const sVal = (r[idx.status] || "").trim().toLowerCase();
        const artist = (r[idx.artist] || "");
        const songName = (r[idx.song] || "");
        if (!songName || EXCLUDE_LIST.includes(artist)) return false;
        if (currentMode === 'released' && sVal !== 'released') return false;
        if (currentMode === 'unreleased' && sVal !== 'unreleased') return false;
        if (currentFilter && artist !== currentFilter) return false;
        if (query && !artist.toLowerCase().includes(query) && !songName.toLowerCase().includes(query)) return false;
        return true;
    });

    let head = `<thead><tr><th class="sticky-song">Song</th><th style="min-width:180px">Artist</th><th>1st Song Tease</th><th>Release Date</th><th>Last Updated</th>`;
    
    if (currentMode === 'released') {
        head += `<th>Pre-Release Posts/ Platform</th><th>1st Wk Streams</th><th>Post-Release Posts/ Platform</th><th>Current Streams</th><th>Avg Weekly Streams</th><th>Total Posts/ Platform</th><th>Avg Views/ Post</th><th>Engagement Rate</th><th>Total UGC</th>`;
    } else {
        head += `<th>Pre-Release Posts/ Platform</th><th>Avg Views/ Post</th><th>Engagement Rate</th><th>Total UGC</th>`;
    }
    head += `</tr></thead><tbody>`;

    songs.forEach(r => {
        const ugcGoal = artistMaxUGC > 10000 ? artistMaxUGC : 10000;
        let row = `<tr>
            <td class="sticky-song">${r[idx.song] || '-'}</td>
            <td style="text-align:left; font-weight:bold;">${r[idx.artist] || '-'}</td>
            <td style="${getTeaseHeat(r[idx.tease], r[idx.relDate])}">${r[idx.tease] || '-'}</td>
            <td>${r[idx.relDate] || '-'}</td>
            <td>${r[idx.updated] || '-'}</td>`;

        if (currentMode === 'released') {
            row += `
                <td style="${getPostHeat(r[idx.pre], 10, 19)}">${r[idx.pre] || 0}</td>
                <td style="${getHeat(r[idx.wk1], 0, maxWk1)}">${r[idx.wk1] || 0}</td>
                <td style="${getPostHeat(r[idx.post], 15, 24)}">${r[idx.post] || 0}</td>
                <td style="background:#0a0a0a;">${r[idx.curr] || 0}</td>
                <td style="${getHeat(r[idx.avgS], 0, maxAvgS)}">${r[idx.avgS] || 0}</td>
                <td style="${getPostHeat(r[idx.totalP], 40, 49)}">${r[idx.totalP] || 0}</td>
                <td style="${getHeat(r[idx.views], 0, maxViews)}">${r[idx.views] || 0}</td>
                <td style="${getEngageHeat(r[idx.er])}">${r[idx.er] || '0%'}</td>
                <td style="${getHeat(r[idx.ugc], 0, ugcGoal)}">${r[idx.ugc] || 0}</td>`;
        } else {
            row += `
                <td style="${getPostHeat(r[idx.pre], 10, 19)}">${r[idx.pre] || 0}</td>
                <td style="${getHeat(r[idx.views], 0, maxViews)}">${r[idx.views] || 0}</td>
                <td style="${getEngageHeat(r[idx.er])}">${r[idx.er] || '0%'}</td>
                <td style="${getHeat(r[idx.ugc], 0, 10000)}">${r[idx.ugc] || 0}</td>`;
        }
        head += row + `</tr>`;
    });
    document.getElementById('table-output').innerHTML = `<table>${head}</tbody></table>`;
}

function setMode(m) { currentMode = m; document.querySelectorAll('.toggle-btn').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+m).classList.add('active'); render(); }
function clearFilter() { currentFilter = null; document.getElementById('view-title').innerText = "Priority Tracks"; document.querySelectorAll('li').forEach(el=>el.classList.remove('active')); render(); }

Papa.parse(MASTER_CSV, {
    download: true, skipEmptyLines: true,
    complete: (res) => {
        headers = res.data[0]; 
        allData = res.data.slice(1);
        const list = document.getElementById('artist-list');
        ARTISTS.sort().forEach(a => {
            let li = document.createElement('li'); li.innerText = a;
            li.onclick = () => { 
                document.querySelectorAll('li').forEach(el=>el.classList.remove('active')); 
                li.classList.add('active'); currentFilter = a; 
                document.getElementById('view-title').innerText = a; render(); 
            };
            list.appendChild(li);
        });
        render();
    }
});
</script>
</body>
</html>
